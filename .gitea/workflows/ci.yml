name: Node.js CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint and Test

    steps:
      - name: Checkout Source Files
        uses: actions/checkout@v4

      - name: Use Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Install Dependencies
        run: pnpm install

      - name: Verify Build
        run: pnpm run build

      - name: Lint Source Files
        run: pnpm run lint

      - name: Run Tests
        run: pnpm run test
